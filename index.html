<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="author" content="Fahad Bagwan">
<title>Tic-Tac-Toe | Made by Fahad Bagwan</title>
<style>
  :root { --text: #f8fafc; --card: rgba(255,255,255,0.08); --accent: #facc15; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  button { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background: linear-gradient(135deg, #0f172a, #1e1b4b, #701a75, #0f172a);
    background-size: 300% 300%;
    animation: bgShift 18s ease infinite;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px 14px;
  }
  @keyframes bgShift { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }

  h1 {
    margin: 0 0 14px;
    font-size: 30px;
    text-align: center;
    background: linear-gradient(90deg, #fde68a, #f472b6, #60a5fa, #fde68a);
    background-size: 250% auto;
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    animation: shine 4s linear infinite;
  }
  @keyframes shine { to { background-position: 250% center; } }

  .screen { width: min(94vw, 420px); }
  .card {
    background: var(--card);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 22px;
    padding: 22px;
    box-shadow: 0 12px 40px rgba(0,0,0,.35);
    animation: floatIn .45s ease both;
  }
  @keyframes floatIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

  input {
    width: 100%;
    padding: 13px 14px;
    margin-bottom: 10px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,.2);
    background: rgba(0,0,0,.3);
    color: var(--text);
    font: inherit;
    font-size: 16px; /* stops iPhone zoom on focus */
  }
  input:focus { outline: 2px solid var(--accent); }

  .btn {
    width: 100%;
    cursor: pointer; border: none; border-radius: 12px; padding: 13px 16px;
    font: inherit; font-weight: 700; font-size: 16px; color: #fff;
    background: linear-gradient(135deg, #f59e0b, #ef4444);
    box-shadow: 0 6px 16px rgba(239,68,68,.35);
    transition: transform .15s, filter .15s;
  }
  .btn:hover { filter: brightness(1.1); }
  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.ghost { background: rgba(255,255,255,.15); box-shadow: none; width: auto; padding: 9px 14px; font-size: 14px; }
  .btn.small { width: auto; padding: 9px 14px; font-size: 14px; }

  .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .tab {
    flex: 1; padding: 10px; border: none; border-radius: 10px; cursor: pointer;
    background: rgba(255,255,255,.1); color: var(--text); font: inherit; font-weight: 600;
  }
  .tab.active { background: rgba(255,255,255,.28); }

  .msg { min-height: 20px; margin: 10px 0 0; text-align: center; color: #fca5a5; font-size: 14px; }

  /* Menu */
  .hello { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .hello b { color: var(--accent); }
  .menu-btn {
    display: block; width: 100%; margin-bottom: 10px; padding: 16px; text-align: left;
    border-radius: 16px; border: 1px solid rgba(255,255,255,.15);
    background: rgba(255,255,255,.08); color: var(--text); font: inherit; font-size: 17px; font-weight: 600;
    cursor: pointer; transition: transform .15s, background .2s;
  }
  .menu-btn:hover { background: rgba(255,255,255,.18); transform: translateX(4px); }
  .menu-btn small { display: block; font-weight: 400; opacity: .7; font-size: 13px; margin-top: 3px; }

  /* Game */
  .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 8px; }
  .top span { font-weight: 700; font-size: 16px; }
  .scores { display: flex; justify-content: space-around; font-size: 14px; margin-bottom: 14px; opacity: .9; flex-wrap: wrap; gap: 6px; }
  .scores b { color: var(--accent); font-size: 18px; }

  .online { margin-bottom: 14px; }
  .join-row { display: flex; gap: 8px; }
  .join-row input { margin: 0; text-transform: uppercase; letter-spacing: 2px; }
  .join-row .btn { width: auto; padding: 0 16px; font-size: 15px; }
  .or { text-align: center; opacity: .6; font-size: 13px; margin: 10px 0; }
  .code-box {
    text-align: center; padding: 12px; border-radius: 14px;
    background: rgba(0,0,0,.25); margin-bottom: 14px;
  }
  .code-box small { opacity: .7; }
  .code-big { display: block; font-size: 30px; font-weight: 800; letter-spacing: 6px; color: var(--accent); margin: 4px 0 8px; }

  .board {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    width: min(84vw, 320px); margin: 0 auto;
  }
  .cell {
    aspect-ratio: 1; border: none; border-radius: 14px; background: rgba(0,0,0,.3);
    color: #fff; font-size: clamp(36px, 12vw, 56px); font-weight: 800; cursor: pointer;
    transition: transform .15s, background .2s;
  }
  .cell:hover:not(:disabled) { background: rgba(255,255,255,.15); transform: scale(1.04); }
  .cell:disabled { cursor: default; }
  .cell.X { color: #60a5fa; }
  .cell.O { color: #f472b6; }
  .cell.win { background: rgba(250,204,21,.45); animation: pulse .6s infinite alternate; }
  @keyframes pulse { to { transform: scale(1.07); } }

  .status { min-height: 26px; text-align: center; font-size: 18px; font-weight: 700; margin: 16px 0 10px; }
  .again { margin-top: 6px; }

  footer { margin-top: 22px; font-size: 14px; opacity: .85; text-align: center; }
  footer b {
    background: linear-gradient(90deg, #fde68a, #f472b6);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
</style>
</head>
<body>

<h1>❌⭕ Tic-Tac-Toe</h1>

<!-- Login / Sign up -->
<section class="screen" id="authScreen" hidden>
  <div class="card">
    <div class="tabs">
      <button class="tab active" id="tabLogin" type="button">Log in</button>
      <button class="tab" id="tabSignup" type="button">Sign up</button>
    </div>
    <form id="authForm">
      <input id="username" placeholder="Username (3-16 letters/numbers)" autocomplete="username" maxlength="16" required>
      <input id="password" type="password" placeholder="Password (min 6 characters)" autocomplete="current-password" required>
      <button class="btn" id="authBtn" type="submit">Log in</button>
    </form>
    <p class="msg" id="authMsg"></p>
  </div>
</section>

<!-- Main menu -->
<section class="screen" id="menuScreen" hidden>
  <div class="card">
    <div class="hello">
      <span>Hi, <b id="hiName"></b> 👋</span>
      <button class="btn ghost" id="logoutBtn" type="button">Log out</button>
    </div>
    <button class="menu-btn" data-mode="ai">🤖 Play vs AI<small>Can you beat the computer?</small></button>
    <button class="menu-btn" data-mode="local">👥 2 Players (same phone)<small>Pass the phone and take turns</small></button>
    <button class="menu-btn" data-mode="online">🌐 Play with a friend online<small>Create a room and share the code</small></button>
  </div>
</section>

<!-- Game -->
<section class="screen" id="gameScreen" hidden>
  <div class="card">
    <div class="top">
      <button class="btn ghost" id="backBtn" type="button">← Menu</button>
      <span id="modeTitle"></span>
    </div>

    <div class="scores" id="scores"></div>

    <div class="online" id="onlineBox" hidden>
      <div class="join-row">
        <input id="joinCode" placeholder="Friend's code" maxlength="5" autocomplete="off">
        <button class="btn" id="joinBtn" type="button">Join</button>
      </div>
      <div class="or">— or —</div>
      <button class="btn" id="createBtn" type="button">Create a new room</button>
      <div class="code-box" id="codeBox" hidden>
        <small>Share this code with your friend</small>
        <span class="code-big" id="roomCode"></span>
        <button class="btn small" id="copyBtn" type="button">Copy code</button>
      </div>
    </div>

    <div class="board" id="board"></div>
    <div class="status" id="status"></div>
    <button class="btn again" id="againBtn" type="button" hidden>Play again</button>
  </div>
</section>

<footer>Made with ❤️ by <b>Fahad Bagwan</b></footer>

<script>
  /* ============================================================
     Tic-Tac-Toe frontend  |  Made by Fahad Bagwan
     Modes: AI (minimax), two players on one device, online rooms
     ============================================================ */

  const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  const $ = s => document.querySelector(s);

  // DOM
  const authForm = $('#authForm'), authBtn = $('#authBtn'), authMsg = $('#authMsg');
  const usernameInput = $('#username'), passwordInput = $('#password');
  const tabLogin = $('#tabLogin'), tabSignup = $('#tabSignup');
  const hiName = $('#hiName');
  const boardEl = $('#board'), statusEl = $('#status'), scoresEl = $('#scores');
  const modeTitle = $('#modeTitle'), onlineBox = $('#onlineBox');
  const joinCode = $('#joinCode'), codeBox = $('#codeBox'), roomCode = $('#roomCode');
  const againBtn = $('#againBtn');

  // State
  let token = localStorage.getItem('ttt_token') || '';
  let username = localStorage.getItem('ttt_user') || '';
  let authMode = 'login';

  let mode = null;            // 'ai' | 'local' | 'online'
  let active = false;         // is a game screen open
  let board = Array(9).fill(null);
  let turn = 'X';
  let winLine = null;
  let over = false;
  let busy = false;
  let scores = { X: 0, O: 0, D: 0 };
  let room = null;            // online room state
  let pollId = null;

  /* ---------- API ---------- */
  async function api(action, data = {}) {
    const headers = { 'Content-Type': 'application/json' };
    if (token) headers.Authorization = 'Bearer ' + token;
    const res = await fetch('/api', {
      method: 'POST',
      headers,
      body: JSON.stringify({ action, ...data }),
    });
    const out = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(out.error || 'Something went wrong');
    return out;
  }

  /* ---------- Screens ---------- */
  function showScreen(id) {
    ['authScreen', 'menuScreen', 'gameScreen'].forEach(s => {
      $('#' + s).hidden = (s !== id);
    });
  }

  function enterMenu() {
    hiName.textContent = username;
    showScreen('menuScreen');
  }

  function saveSession(t, u) {
    token = t; username = u;
    localStorage.setItem('ttt_token', t);
    localStorage.setItem('ttt_user', u);
  }

  function clearSession() {
    token = ''; username = '';
    localStorage.removeItem('ttt_token');
    localStorage.removeItem('ttt_user');
  }

  /* ---------- Auth ---------- */
  function setAuthTab(m) {
    authMode = m;
    tabLogin.classList.toggle('active', m === 'login');
    tabSignup.classList.toggle('active', m === 'signup');
    authBtn.textContent = m === 'login' ? 'Log in' : 'Create account';
    passwordInput.autocomplete = m === 'login' ? 'current-password' : 'new-password';
    authMsg.textContent = '';
  }
  tabLogin.addEventListener('click', () => setAuthTab('login'));
  tabSignup.addEventListener('click', () => setAuthTab('signup'));

  authForm.addEventListener('submit', async e => {
    e.preventDefault();
    authMsg.textContent = '';
    authBtn.disabled = true;
    try {
      const out = await api(authMode === 'login' ? 'login' : 'signup', {
        username: usernameInput.value.trim(),
        password: passwordInput.value,
      });
      saveSession(out.token, out.username);
      passwordInput.value = '';
      enterMenu();
    } catch (err) {
      authMsg.textContent = err.message;
    } finally {
      authBtn.disabled = false;
    }
  });

  $('#logoutBtn').addEventListener('click', async () => {
    try { await api('logout'); } catch (e) {}
    clearSession();
    stopPolling();
    showScreen('authScreen');
  });

  /* ---------- Game screen helpers ---------- */
  function setStatus(text) { statusEl.textContent = text; }

  function renderScores() {
    if (mode === 'ai') {
      scoresEl.innerHTML = `You (X): <b>${scores.X}</b> · Draws: <b>${scores.D}</b> · AI (O): <b>${scores.O}</b>`;
    } else if (mode === 'local') {
      scoresEl.innerHTML = `Player 1 (X): <b>${scores.X}</b> · Draws: <b>${scores.D}</b> · Player 2 (O): <b>${scores.O}</b>`;
    } else {
      scoresEl.innerHTML = '';
    }
  }

  function renderBoard(cells, line) {
    [...boardEl.children].forEach((btn, i) => {
      const v = cells[i];
      btn.textContent = v || '';
      btn.className = 'cell' + (v ? ' ' + v : '') + (line && line.includes(i) ? ' win' : '');
    });
  }

  function findWinner(b) {
    for (const [a, c, d] of LINES) {
      if (b[a] && b[a] === b[c] && b[a] === b[d]) return { w: b[a], line: [a, c, d] };
    }
    return b.every(Boolean) ? { w: 'draw', line: null } : null;
  }

  function buildBoard() {
    boardEl.innerHTML = '';
    for (let i = 0; i < 9; i++) {
      const btn = document.createElement('button');
      btn.className = 'cell';
      btn.dataset.i = i;
      btn.type = 'button';
      boardEl.appendChild(btn);
    }
  }

  function openGame(m, title) {
    stopPolling();
    mode = m;
    active = true;
    room = null;
    modeTitle.textContent = title;
    onlineBox.hidden = (m !== 'online');
    codeBox.hidden = true;
    againBtn.hidden = true;
    joinCode.value = '';
    scores = { X: 0, O: 0, D: 0 };
    showScreen('gameScreen');
    buildBoard();
    if (m === 'online') {
      setStatus('Create a room or join your friend’s code');
      renderScores();
      renderBoard(Array(9).fill(null), null);
      boardEl.querySelectorAll('.cell').forEach(c => c.disabled = true);
    } else {
      newLocalRound();
    }
  }

  function closeGame() {
    active = false;
    stopPolling();
    room = null;
    showScreen('menuScreen');
  }

  /* ---------- Local (AI and 2 players) ---------- */
  function newLocalRound() {
    board = Array(9).fill(null);
    turn = 'X';
    winLine = null;
    over = false;
    busy = false;
    againBtn.hidden = true;
    boardEl.querySelectorAll('.cell').forEach(c => c.disabled = false);
    renderBoard(board, null);
    renderScores();
    setStatus(mode === 'ai' ? 'Your turn (X)' : 'Player 1 (X) starts');
  }

  function endLocalIfDone() {
    const r = findWinner(board);
    if (!r) return false;
    over = true;
    winLine = r.line;
    if (r.w === 'draw') {
      scores.D++;
      setStatus("It's a draw 🤝");
    } else {
      scores[r.w]++;
      if (mode === 'ai') setStatus(r.w === 'X' ? 'You win! 🎉' : 'AI wins 🤖');
      else setStatus(`Player ${r.w === 'X' ? 1 : 2} (${r.w}) wins! 🎉`);
    }
    renderBoard(board, winLine);
    renderScores();
    againBtn.hidden = false;
    boardEl.querySelectorAll('.cell').forEach(c => c.disabled = true);
    return true;
  }

  // Minimax: the AI looks through every possible game and picks the best move
  function minimax(b, aiTurn, depth) {
    const r = findWinner(b);
    if (r) {
      if (r.w === 'O') return 10 - depth;
      if (r.w === 'X') return depth - 10;
      return 0;
    }
    let best = aiTurn ? -Infinity : Infinity;
    for (let i = 0; i < 9; i++) {
      if (b[i]) continue;
      b[i] = aiTurn ? 'O' : 'X';
      const s = minimax(b, !aiTurn, depth + 1);
      b[i] = null;
      best = aiTurn ? Math.max(best, s) : Math.min(best, s);
    }
    return best;
  }

  function aiBestMove() {
    let bestScore = -Infinity, move = -1;
    for (let i = 0; i < 9; i++) {
      if (board[i]) continue;
      board[i] = 'O';
      const s = minimax(board, false, 1);
      board[i] = null;
      if (s > bestScore) { bestScore = s; move = i; }
    }
    return move;
  }

  function localMove(i) {
    if (over || busy || board[i]) return;

    if (mode === 'ai') {
      board[i] = 'X';
      renderBoard(board, null);
      if (endLocalIfDone()) return;
      busy = true;
      setStatus('AI is thinking…');
      setTimeout(() => {
        if (!active || mode !== 'ai') return;
        board[aiBestMove()] = 'O';
        busy = false;
        renderBoard(board, null);
        if (!endLocalIfDone()) setStatus('Your turn (X)');
      }, 380);
    } else {
      board[i] = turn;
      turn = turn === 'X' ? 'O' : 'X';
      renderBoard(board, null);
      if (!endLocalIfDone()) setStatus(`Player ${turn === 'X' ? 1 : 2} (${turn})'s turn`);
    }
  }

  /* ---------- Online ---------- */
  function startPolling() {
    stopPolling();
    pollId = setInterval(pollRoom, 1500);
  }
  function stopPolling() {
    if (pollId) clearInterval(pollId);
    pollId = null;
  }

  async function pollRoom() {
    if (!room || !active) return;
    try {
      applyRoom(await api('roomState', { code: room.code }));
    } catch (err) {
      setStatus(err.message);
    }
  }

  function applyRoom(r) {
    room = r;
    const waiting = !r.players.O;
    codeBox.hidden = false;
    roomCode.textContent = r.code;
    onlineBox.querySelector('.join-row').hidden = true;
    onlineBox.querySelector('.or').hidden = true;
    $('#createBtn').hidden = true;

    renderBoard(r.board, r.line);
    const myTurn = !waiting && !r.winner && r.turn === r.mySymbol;
    boardEl.querySelectorAll('.cell').forEach(c => {
      c.disabled = !myTurn || !!r.board[+c.dataset.i];
    });

    if (waiting) {
      setStatus('Waiting for your friend to join…');
    } else if (r.winner) {
      if (r.winner === 'draw') setStatus("It's a draw 🤝");
      else setStatus(r.winner === r.mySymbol ? 'You win! 🎉' : 'Your friend wins 🏆');
    } else {
      setStatus(myTurn ? `Your turn (${r.mySymbol})` : "Friend's turn…");
    }

    againBtn.hidden = !r.winner;
    scoresEl.innerHTML = `You are <b>${r.mySymbol}</b> · Room <b>${r.code}</b>`;
  }

  async function onlineMove(i) {
    if (!room || busy || room.winner || room.board[i] || room.turn !== room.mySymbol) return;
    busy = true;
    try {
      applyRoom(await api('move', { code: room.code, index: i }));
    } catch (err) {
      setStatus(err.message);
    } finally {
      busy = false;
    }
  }

  async function createRoom() {
    try {
      applyRoom(await api('createRoom'));
      startPolling();
    } catch (err) {
      setStatus(err.message);
    }
  }

  async function joinRoom() {
    const code = joinCode.value.trim().toUpperCase();
    if (code.length < 5) { setStatus('Enter the 5-letter code'); return; }
    try {
      applyRoom(await api('joinRoom', { code }));
      startPolling();
    } catch (err) {
      setStatus(err.message);
    }
  }

  $('#createBtn').addEventListener('click', createRoom);
  $('#joinBtn').addEventListener('click', joinRoom);
  joinCode.addEventListener('keydown', e => { if (e.key === 'Enter') joinRoom(); });

  $('#copyBtn').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(room ? room.code : '');
      $('#copyBtn').textContent = 'Copied!';
      setTimeout(() => $('#copyBtn').textContent = 'Copy code', 1500);
    } catch (e) {
      setStatus('Code: ' + (room ? room.code : ''));
    }
  });

  /* ---------- Board clicks & buttons ---------- */
  boardEl.addEventListener('click', e => {
    const cell = e.target.closest('.cell');
    if (!cell || !active) return;
    const i = +cell.dataset.i;
    if (mode === 'online') onlineMove(i);
    else localMove(i);
  });

  againBtn.addEventListener('click', async () => {
    if (mode === 'online') {
      try {
        applyRoom(await api('rematch', { code: room.code }));
      } catch (err) {
        setStatus(err.message);
      }
    } else {
      newLocalRound();
    }
  });

  document.querySelectorAll('.menu-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const m = btn.dataset.mode;
      const titles = { ai: '🤖 vs AI', local: '👥 2 Players', online: '🌐 Online' };
      openGame(m, titles[m]);
    });
  });

  $('#backBtn').addEventListener('click', closeGame);

  /* ---------- Start up ---------- */
  async function start() {
    if (!token) { showScreen('authScreen'); return; }
    try {
      const me = await api('me');
      username = me.username;
      localStorage.setItem('ttt_user', username);
      enterMenu();
    } catch (err) {
      clearSession();
      showScreen('authScreen');
    }
  }
  start();
</script>
</body>
</html>
